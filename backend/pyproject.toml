[project]
name = "contextos-backend"
version = "0.1.0"
description = "AI-powered context synthesis engine for dev tickets"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "anthropic",
    "langgraph",
    "llama-index",
    "llama-index-readers-slack",
    "llama-index-readers-notion",
    "supabase",
    "celery[redis]",
    "redis",
    "pydantic>=2.0",
    "pydantic-settings",
    "httpx",
    "lmnr",
    "sentry-sdk[fastapi]",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
