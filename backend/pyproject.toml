[project]
name = "contextos-backend"
version = "0.1.0"
description = "AI-powered context synthesis engine for dev tickets"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "google-genai",
    "openai>=1.0",
    "langgraph",
    "supabase",
    "redis",
    "pydantic>=2.0",
    "pydantic-settings",
    "httpx[http2]",
    "lmnr",
    "sentry-sdk[fastapi]",
    "structlog",
    "python-dotenv",
    "slack-bolt",
    "pgvector",
    "sqlmodel>=0.0.22",
    "asyncpg",
    "sqlalchemy[asyncio]>=2.0",
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
