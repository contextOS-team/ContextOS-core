services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - ENVIRONMENT=prod
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - contextos

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Reuse the canonical runtime values from .env. Keeping duplicate
        # NEXT_PUBLIC_* entries in production caused rebuilt hosts to compile
        # an unusable frontend when only the canonical values were restored.
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        NEXT_PUBLIC_BACKEND_URL: ${BACKEND_URL}
        NEXT_PUBLIC_APP_URL: ${APP_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN:-}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-ContextOSBot}
    env_file: .env
    environment:
      # Cap Node heap below host RAM and rein in glibc arena-per-thread bloat
      # so sharp/Next don't OOM on the 4 GB box.
      - NODE_OPTIONS=--max-old-space-size=2560
      - MALLOC_ARENA_MAX=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      # Persist Next.js ISR/data cache across deploys so revalidated pages
      # survive container restarts. Mount only .next/cache, not the whole
      # .next dir — otherwise stale code from old builds gets served.
      - next_cache:/app/.next/cache
    networks:
      - contextos

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - contextos

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount our configs and suppress the stock default.conf
      - ./nginx/api.conf:/etc/nginx/conf.d/api.conf:ro
      - ./nginx/app.conf:/etc/nginx/conf.d/app.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - contextos

volumes:
  redis_data:
  next_cache:

networks:
  contextos:
    driver: bridge
