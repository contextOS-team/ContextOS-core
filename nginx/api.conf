server {
    listen 80;
    server_name api.contextos.pro;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.contextos.pro;

    ssl_certificate /etc/letsencrypt/live/api.contextos.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.contextos.pro/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP/1.1 + conditional Connection header lets us:
        #  - keepalive to upstream when no Upgrade header present (fast path)
        #  - upgrade cleanly for WebSockets when one is present
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Headroom for large response headers (Set-Cookie, Sentry, etc.)
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}
