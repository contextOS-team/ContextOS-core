server {
    listen 80;
    server_name contextos.pro;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name contextos.pro;

    ssl_certificate /etc/letsencrypt/live/contextos.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contextos.pro/privkey.pem;

    # Reuse TLS sessions to avoid full handshakes on every connection
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Hashed, immutable Next build assets — long cache, served via upstream keepalive
    location /_next/static/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_buffer_size 32k;
        proxy_buffers 8 32k;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Static files served from /public
    location /static/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming SSR (Suspense, loading.tsx) only works if nginx flushes
        # chunks to the client as Next emits them. Default proxy_buffering on
        # collects the full response before sending — silently breaks streaming.
        proxy_buffering off;
        proxy_request_buffering off;

        # Headroom for large response headers (Set-Cookie + Sentry metadata);
        # default 4k buffers overflow and return 502.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}
