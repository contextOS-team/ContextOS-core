server {
    listen 80;
    server_name contextos.pro;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name contextos.pro;

    ssl_certificate /etc/letsencrypt/live/contextos.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contextos.pro/privkey.pem;

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js can emit large response headers (Set-Cookie + Sentry metadata);
        # default 4k buffers overflow and return 502.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}
