name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            cd /opt/contextos
            git pull origin main

            # Run database migrations before deploying new code.
            # Uses a schema_migrations table to track which files
            # have already been applied — only new ones run.
            bash scripts/run-migrations.sh

            # Install backend dependencies if pyproject.toml changed
            cd backend
            uv sync --frozen 2>/dev/null || uv sync || pip install -e .
            cd ..

            # Build frontend
            cd apps/web
            npm run build

            # Restart services
            systemctl restart contextos-app
            systemctl restart contextos-api

            # Verify services are running
            sleep 3
            systemctl is-active contextos-app
            systemctl is-active contextos-api
