name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Backend tests + eval gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev
      - name: Run pytest (includes golden-dataset eval thresholds)
        working-directory: backend
        # Import-time-only test env: several modules read settings at import.
        # Values mirror tests/conftest.py; nothing connects to these endpoints.
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          SUPABASE_JWT_SECRET: test-jwt-secret-for-unit-tests-only
          SUPABASE_URL: https://test-project.supabase.co
          SUPABASE_ANON_KEY: test-publishable-key
          ENVIRONMENT: dev
          BACKEND_URL: http://localhost:8000
        run: uv run pytest -q -m "not integration"

  web:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Run vitest
        working-directory: apps/web
        run: pnpm exec vitest run

  deploy:
    name: Deploy to production
    needs: [test, web]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -euo pipefail
            cd /opt/contextos
            echo "--- fetching origin/main ---"
            git fetch --prune origin
            git reset --hard origin/main
            echo "--- applying pending DB migrations ---"
            bash scripts/deploy-migrations.sh
            echo "--- building images ---"
            docker compose -f docker-compose.prod.yml build
            echo "--- restarting stack ---"
            docker compose -f docker-compose.prod.yml up -d
            # Force-recreate nginx on every deploy: nginx conf files are bind-mounted as
            # single files, so `git reset --hard` replaces inodes that the running
            # container still has pinned. Without this, nginx serves stale config until
            # someone SSHes in and recreates it manually.
            docker compose -f docker-compose.prod.yml up -d --force-recreate nginx
            echo "--- waiting for health ---"
            sleep 15
            docker compose -f docker-compose.prod.yml ps
            echo "--- pruning old images ---"
            docker image prune -f
            echo "--- smoke test ---"
            curl -sf -o /dev/null -w "app: %{http_code}\n" -k -H "Host: contextos.pro" https://localhost/
            curl -sf -o /dev/null -w "api: %{http_code}\n" -k -H "Host: api.contextos.pro" https://localhost/api/health
