name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e  # fail fast on any error

            cd /opt/contextos
            git checkout -- .
            git pull origin main

            # Run database migrations before deploying new code
            bash scripts/run-migrations.sh

            # Install backend dependencies
            cd backend
            if command -v uv &>/dev/null; then
              uv sync --frozen 2>/dev/null || uv sync
            else
              [ -d .venv ] || python3 -m venv .venv
              .venv/bin/pip install -e .
            fi
            cd ..

            # Build frontend (must succeed before restarting services)
            cd apps/web
            npm run build
            cd ../..

            # Only restart after successful build
            systemctl restart contextos-app
            systemctl restart contextos-api

            # Verify services are running
            sleep 5
            systemctl is-active contextos-app
            systemctl is-active contextos-api
