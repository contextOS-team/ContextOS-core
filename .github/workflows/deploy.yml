name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e  # fail fast on any error

            cd /opt/contextos
            git pull origin main

            # Run database migrations (non-blocking — skip if supabase CLI not available)
            bash scripts/run-migrations.sh || echo "⚠ Migrations skipped (supabase CLI not configured)"

            # Install backend dependencies if pyproject.toml changed
            cd backend
            uv sync --frozen 2>/dev/null || uv sync || pip install -e .
            cd ..

            # Build frontend (must succeed before restarting services)
            cd apps/web
            npm run build
            cd ../..

            # Only restart after successful build
            systemctl restart contextos-app
            systemctl restart contextos-api

            # Verify services are running
            sleep 5
            systemctl is-active contextos-app
            systemctl is-active contextos-api
